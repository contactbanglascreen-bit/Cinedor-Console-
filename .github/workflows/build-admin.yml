name: Build Cinedor Admin APK

on:
  push:
    branches: [main]
    paths-ignore: ["worker/**", "README.md"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Prepare signing key
        run: base64 --decode debug.keystore.base64 > debug.keystore

      - name: Build APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk CinedorAdmin.apk

      - name: Publish update (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-${{ github.run_number }}
          name: Cinedor Admin 1.0.${{ github.run_number }}
          body_path: RELEASE_NOTES.md
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: CinedorAdmin.apk
